name: Deploy DeepCycloNet to GitHub Pages

on:
  push:
    branches: ["main", "feature/lovable-frontend"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend SPA
        working-directory: frontend
        run: npm run build

      - name: Prepare GitHub Pages Distribution
        run: |
          # Copy 404.html for client-side routing fallback
          cp frontend/dist/index.html frontend/dist/404.html
          # Include classic demo app under /demo/ subpath
          if [ -d "demo_app" ]; then
            mkdir -p frontend/dist/demo
            cp -r demo_app/* frontend/dist/demo/
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "frontend/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
