# RI Model 2: Multi-Task Joint RI + Continuous Intensity Forecaster
experiment_id: "ri_model2_multitask_joint"
priority: "essential"
hypothesis: "Jointly learning continuous multi-horizon forecasting alongside binary RI classification improves representation sharing and enhances RI PR-AUC over single-task classifiers."

dataset:
  name: "TCIR_All_Basins"
  k_history: 5
  cadence_hours: 3
  channels: [0, 1, 2]

features:
  group: "full_feature_set"

model:
  type: "ri_multitask"
  backbone: "resnet18"
  temporal_type: "transformer"
  fusion_type: "gated"
  d_model: 256
  num_layers: 2
  nhead: 8
  dropout: 0.1
  pretrained: true

training:
  loss: "focal"
  consistency_weight: 0.15
  eval_metric: "pr_auc"
  precision: "bf16"
  batch_size: 64
  epochs: 25
  learning_rate: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 7
  num_workers: 4
