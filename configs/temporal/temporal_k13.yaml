# Temporal Ablation: K=13 (36h history, 13 frames at 3h cadence)
experiment_id: "temporal_k13_36h_context"
priority: "exploratory"
hypothesis: "36-hour multi-spectral history provides multi-diurnal cycle information, but may hit diminishing returns if older frames add noise."

dataset:
  name: "TCIR_All_Basins"
  k_history: 13
  cadence_hours: 3
  channels: [0, 1, 2]
  aligned: true

features:
  group: "satellite_only"

model:
  type: "cnn_transformer"
  backbone: "resnet18"
  d_model: 256
  num_layers: 3
  nhead: 8
  dropout: 0.1
  pretrained: true

training:
  loss: "huber"
  eval_metric: "val_mae"
  precision: "bf16"
  batch_size: 48
  epochs: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 6
  num_workers: 4
