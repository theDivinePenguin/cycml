# Modality Ablation: IR1-Only Forecaster
experiment_id: "modality_ir1_only"
priority: "high"
hypothesis: "Single-channel infrared provides core convective cloud-top temperature but lacks upper-tropospheric moisture dynamics (WV) and low-level cloud boundary detail (VIS)."

dataset:
  name: "TCIR_All_Basins"
  k_history: 5
  cadence_hours: 3
  channels: [0] # IR1 only

features:
  group: "satellite_only"

model:
  type: "cnn_transformer"
  backbone: "resnet18"
  d_model: 256
  num_layers: 2
  nhead: 8
  dropout: 0.1
  pretrained: true

training:
  loss: "huber"
  eval_metric: "val_mae"
  precision: "bf16"
  batch_size: 64
  epochs: 25
  learning_rate: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 6
  num_workers: 4
