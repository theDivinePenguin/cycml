# Multi-Modal Fusion: Gated Residual Fusion
experiment_id: "fusion_gated_residual"
priority: "high"
hypothesis: "Dynamic gating modulates environmental representations conditioned on visual storm structure, outperforming simple concatenation."

dataset:
  name: "TCIR_All_Basins"
  k_history: 5
  cadence_hours: 3
  channels: [0, 1, 2]
  aligned: true

features:
  group: "all_environmental"

model:
  type: "ri_multitask"
  backbone: "resnet18"
  temporal_type: "transformer"
  fusion_type: "gated"
  d_model: 256
  num_layers: 2
  nhead: 8
  dropout: 0.1
  pretrained: true

training:
  loss: "focal"
  eval_metric: "val_mae"
  precision: "bf16"
  batch_size: 64
  epochs: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 6
  num_workers: 4
